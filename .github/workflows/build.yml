name: Build Jakesnap APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Find and rename APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          mkdir -p artifacts
          cp "$APK" artifacts/Jakesnap-v1.0.apk
          ls -la artifacts/
          ls -lh artifacts/Jakesnap-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jakesnap-v1.0
          path: artifacts/Jakesnap-v1.0.apk
          retention-days: 30
